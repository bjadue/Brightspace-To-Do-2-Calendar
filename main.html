<html lang="en">
  <head>
    <meta charset="UTF-8">
    
    <title>D2L Brightspace To-Do to Calendar - UI</title>
    <meta name="description" content="Export your To-Do list to Google Calendar or MS To-DO.">
  </head>
  <script src="./internalScripts/renderCheckbox.js"></script>
  <style>
    html{
      width: 400px;
      height: 500px;
    }
    body{
      padding: 5px;
    }
    .container{
      display: flex;
      justify-content: center;
      align-items: left;
      width: 75%;
      height: auto;
      border: 2px solid black;
      margin: 0 auto;
      background-color: steelblue;
      overflow-y: scroll;
      height: 300px;
    }
    ul{
      padding-left: 2px;
      padding-bottom: 2px;
    }
    .task-item{
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .task-item:hover{
      background-color: rgb(0, 225, 255);
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1rem;
      min-width: 10ch;
      min-height: 44px;

      background-color: gray;
      color: white;
      border-radius: 50px;

      transition: background-color 0.2s ease, transform 0.1s ease;
    }
    .btn:hover{
      background-color: rgb(98, 98, 98);
      cursor: pointer;
    }
    .btn:active{
      transform: scale(0.99);
    }
  </style>
  <body>
    <h3>D2L To-Do to Calendar</h3>
    <div class="container">
      <ul id="checkboxList"></ul>
    </div>
    <button id="btnExportToICS" class="btn">
      <label>Export to .ics file.</label>
    </button>
  </body>
</html>
