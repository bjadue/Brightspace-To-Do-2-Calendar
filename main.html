<html lang="en">
  <head>
    <meta charset="UTF-8">
    
    <title>D2L Brightspace To-Do to Calendar - UI</title>
    <meta name="description" content="Export your To-Do list to Google Calendar or MS To-DO.">
  </head>
  <script src="./internalScripts/renderCheckbox.js"></script>
  <style>
    html{
      width: 400px;
      height: 500px;
    }
    body{
      padding: 5px;
    }
    .container{
      display: flex;
      justify-content: center;
      align-items: left;
      width: 75%;
      height: auto;
      border: 2px solid black;
      margin: 0 auto;
      background-color: steelblue;
      overflow-y: scroll;
      height: 300px;
    }
    ul{
      padding-left: 2px;
      padding-bottom: 2px;
    }
    .task-item{
      overflow-wrap: anywhere;
      word-break: break-word;
      
    }
    .task-item:hover{
      background-color: rgb(0, 225, 255);
    }
  </style>
  <body>
    <h3>D2L To-Do to Calendar</h3>
    <div class="container">
      <ul id="checkboxList"></ul>
    </div>
  </body>
</html>
